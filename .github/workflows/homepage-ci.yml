name: Homepage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zirveokey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zirveokey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zirveokey_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/js/main.js
          node --check public/js/oyun.js
          node --check tests/two-user-integration.js
      - name: Smoke-test homepage and health endpoint
        run: |
          npm start > /tmp/zirveokey.log 2>&1 &
          echo $! > /tmp/zirveokey.pid
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/zirveokey.log; exit 1; fi
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'ZirveOkey'
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'hero-copy'
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'Yeni Üyeler'
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'En Çok Aktif Üyeler'
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'Puan Sıralaması'
          curl --fail --silent http://127.0.0.1:3000/css/styles.css | grep -q '.community-card'
          curl --fail --silent http://127.0.0.1:3000/css/styles.css | grep -q '.hero-copy'
          curl --fail --silent http://127.0.0.1:3000/css/styles.css | grep -q 'radio.is-open .radio-panel'
          curl --fail --silent http://127.0.0.1:3000/js/main.js | grep -q 'radioPlay'
          curl --fail --silent http://127.0.0.1:3000/js/main.js | grep -q '/api/radio/status'
          curl --fail --silent http://127.0.0.1:3000/js/main.js | grep -q 'audio.src=streamUrl'
          curl --fail --silent http://127.0.0.1:3000/js/main.js | grep -q 'panel.inert=!open'
          test -s public/assets/hero-background.png
          kill "$(cat /tmp/zirveokey.pid)"
      - name: Two-user membership, chat and presence integration test
        run: node tests/two-user-integration.js
